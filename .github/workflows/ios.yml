name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "sim = 只驗證能編譯（不需 Apple 帳號）；testflight = 簽章並上傳 TestFlight"
        default: sim
        type: choice
        options: [sim, testflight]
      build_number:
        description: "Build 編號（每次上傳都要比上次大）"
        default: "1"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install + sync web assets
        run: |
          npm ci
          npx cap sync ios
      - name: Xcode version
        run: xcodebuild -version
      - name: Simulator build (no signing)
        if: github.event_name == 'push' || inputs.mode == 'sim'
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee $RUNNER_TEMP/build.log | tail -60; exit ${PIPESTATUS[0]}
      - name: Archive + upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          mkdir -p ~/private_keys && echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cd ios/App
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive DEVELOPMENT_TEAM=$TEAM_ID CURRENT_PROJECT_VERSION=${{ inputs.build_number }} $AUTH archive | tail -40
          cat > $RUNNER_TEMP/export.plist <<P
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          P
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out $AUTH | tail -30
